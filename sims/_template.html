<!DOCTYPE html>
<!--
  TEMPLATE for a new simulator.
  To add a simulator:
    1. Copy this file and rename it, e.g. sims/pendulum.html
       (use lowercase words separated by hyphens)
    2. Change the <title> and the heading text.
    3. Build your simulator inside <main class="content">.
    4. That's it. When served by a local web server, it appears
       in the sidebar automatically. (Files starting with "_" are
       ignored, which is why this template never shows up.)
  Keep the two lines marked KEEP so the shared sidebar + styles load.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Simulator — PHYlip Simulators</title>
<link rel="stylesheet" href="../styles.css">      <!-- KEEP -->
</head>
<body>
<div class="app">
  <aside id="app-sidebar" class="sidebar"></aside>       <!-- KEEP: sidebar mounts here -->

  <main class="content">
    <div class="wrap">
      <h1>New Simulator</h1>
      <p class="subtitle">Describe what this simulator shows.</p>

      <div class="layout">
        <div class="panel">
          <div class="control">
            <label>Example control <span class="val"><span id="demo-val">1</span></span></label>
            <input type="range" id="demo" min="0" max="10" step="1" value="1">
          </div>
        </div>
        <div class="panel canvas-card">
          <canvas id="c" width="760" height="460"></canvas>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  /* Your simulator code here. */
</script>
<script src="../sidebar.js"></script>              <!-- KEEP: shared sidebar -->
</body>
</html>
